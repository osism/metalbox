---
- name: Mirror debian packages
  hosts: all

  vars:
    _publish: "{{ publish | default(False) }}"
    docker_registry: quay.io


  tasks:
    - name: Run mirror script
      become: true
      ansible.builtin.shell:  # noqa command-instead-of-module
        executable: /bin/bash
        cmd: "{{ lookup('file', 'files/create-mirror.sh') }}"
      environment:
        SCRIPT_DIR: "{{ zuul.project.src_dir }}/zuul/files"
      changed_when: true

    - name: Log into registry
      community.docker.docker_login:
        registry_url: "{{ docker_registry }}"
        username: "{{ secret.DOCKER_USERNAME }}"
        password: "{{ secret.DOCKER_PASSWORD }}"
      when: _publish | default(false) | bool
      no_log: true

    - name: Prepare export archive
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          version=$(date +%Y%m%d)
          docker tag "quay.io/osism-mirror/ubuntu-noble:$version" registry.osism.tech/osism/packages/ubuntu-noble:latest
          docker save registry.osism.tech/osism/packages/ubuntu-noble:latest | bzip2 > ubuntu-noble.tar.bz2
      when: _publish | default(false) | bool
      changed_when: true

    - name: Verify bzip2 archive integrity
      ansible.builtin.command:
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: bzip2 -t ubuntu-noble.tar.bz2
      when: _publish | default(false) | bool
      changed_when: false

    - name: Generate SHA256 checksum
      ansible.builtin.command:
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: sha256sum ubuntu-noble.tar.bz2
      register: _sha256_result
      when: _publish | default(false) | bool
      changed_when: false

    - name: Write SHA256 checksum file
      ansible.builtin.copy:
        content: "{{ _sha256_result.stdout }}\n"
        dest: "{{ zuul.project.src_dir | default('.') }}/ubuntu-noble.tar.bz2.CHECKSUM"
        mode: "0644"
      when: _publish | default(false) | bool

    - name: Print SHA256 checksum
      ansible.builtin.debug:
        msg: "{{ _sha256_result.stdout }}"
      when: _publish | default(false) | bool

    - name: Install rclone
      become: true
      ansible.builtin.apt:
        name: rclone
        state: present
        update_cache: true
      when: _publish | default(false) | bool

    - name: Run push and upload script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          version=$(date +%Y%m%d)
          docker push "quay.io/osism-mirror/ubuntu-noble:$version"

          # Upload the tarball before the checksum that describes it. Both
          # objects have fixed names, so the pair is briefly inconsistent
          # either way, but this order keeps that window to one small object
          # instead of the whole tarball transfer, and a failed tarball upload
          # then leaves the previous artifact and its checksum both intact.
          rclone copyto ubuntu-noble.tar.bz2 s3:osism/metalbox/ubuntu-noble.tar.bz2
          rclone copyto ubuntu-noble.tar.bz2.CHECKSUM s3:osism/metalbox/ubuntu-noble.tar.bz2.CHECKSUM
      environment:
        RCLONE_CONFIG_S3_TYPE: s3
        RCLONE_CONFIG_S3_PROVIDER: Ceph
        RCLONE_CONFIG_S3_ENDPOINT: https://nbg1.your-objectstorage.com
        RCLONE_CONFIG_S3_REGION: nbg1
        RCLONE_CONFIG_S3_ACCESS_KEY_ID: "{{ secret.ACCESS_KEY | trim }}"
        RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "{{ secret.SECRET_KEY | trim }}"
        RCLONE_CONFIG_S3_ACL: public-read
        RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
      when: _publish | default(false) | bool
      changed_when: true
      no_log: true
