---
- name: Mirror octavia image
  hosts: all

  vars:
    _openstack_versions: "{{ openstack_versions | default(['2024.2', '2025.1']) }}"
    _publish: "{{ publish | default(False) }}"

  tasks:
    - name: Run export script for {{ item }}
      become: true
      ansible.builtin.shell:  # noqa command-instead-of-module
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          bash scripts/octavia-export.sh {{ item }}
      changed_when: true
      loop: "{{ _openstack_versions }}"

    - name: Install rclone
      become: true
      ansible.builtin.apt:
        name: rclone
        state: present
        update_cache: true
      when: _publish | default(false) | bool

    - name: Write the rclone configuration with the object-storage credentials
      ansible.builtin.copy:
        dest: "{{ ansible_user_dir }}/.rclone.conf"
        mode: "0600"
        content: |
          [s3]
          type = s3
          provider = Ceph
          endpoint = https://nbg1.your-objectstorage.com
          region = nbg1
          access_key_id = {{ secret.ACCESS_KEY | trim }}
          secret_access_key = {{ secret.SECRET_KEY | trim }}
          acl = public-read
          no_check_bucket = true
      when: _publish | default(false) | bool
      no_log: true

    - name: Run upload for {{ item }}
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          sha256sum octavia-export-{{ item }}.img > octavia-export-{{ item }}.img.CHECKSUM

          # Upload the image before the checksum that describes it, so the
          # published pair is inconsistent only for the small object and a
          # failed image upload leaves the previous pair intact.
          rclone copyto octavia-export-{{ item }}.img s3:osism/metalbox/octavia-export-{{ item }}.img
          rclone copyto octavia-export-{{ item }}.img.CHECKSUM s3:osism/metalbox/octavia-export-{{ item }}.img.CHECKSUM
      environment:
        RCLONE_CONFIG: "{{ ansible_user_dir }}/.rclone.conf"
        RCLONE_VERBOSE: "1"
        RCLONE_STATS: 30s
        RCLONE_STATS_ONE_LINE: "true"
      when: _publish | default(false) | bool
      changed_when: true
      loop: "{{ _openstack_versions }}"
